<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor de reputação</title>
<style>
:root {
  color-scheme: light;
  --plano: #f3f4f7;
  --superficie: #ffffff;
  --superficie-2: #f7f8fa;
  --tinta: #1d2433;
  --tinta-2: #5b6475;
  --tinta-3: #8a93a3;
  --grade: #eceef2;
  --trilho: #eef1f5;
  --eixo: #d5d9e0;
  --borda: rgba(16, 24, 40, 0.07);
  --sombra: 0 1px 2px rgba(16, 24, 40, 0.04), 0 6px 24px rgba(16, 24, 40, 0.05);
  --serie-1: #2a78d6;
  --serie-2: #eb6834;
  --serie-3: #1baf7a;
  --apagado: #d6dae1;
  --lavagem: rgba(42, 120, 214, 0.07);
  --lavagem-forte: rgba(42, 120, 214, 0.12);
  --bom: #0ca30c;
  --atencao: #fab219;
  --critico: #d03b3b;
  --sobe: #0a7d0a;
  --desce: #c13030;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --plano: #111317;
    --superficie: #1a1d23;
    --superficie-2: #20242b;
    --tinta: #e8eaee;
    --tinta-2: #aab1bd;
    --tinta-3: #7c8493;
    --grade: #262a31;
    --trilho: #252930;
    --eixo: #353a43;
    --borda: rgba(255, 255, 255, 0.07);
    --sombra: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 24px rgba(0, 0, 0, 0.25);
    --serie-1: #3987e5;
    --serie-2: #d95926;
    --serie-3: #199e70;
    --apagado: #3a3f48;
    --lavagem: rgba(57, 135, 229, 0.10);
    --lavagem-forte: rgba(57, 135, 229, 0.18);
    --sobe: #0ca30c;
    --desce: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --plano: #111317;
  --superficie: #1a1d23;
  --superficie-2: #20242b;
  --tinta: #e8eaee;
  --tinta-2: #aab1bd;
  --tinta-3: #7c8493;
  --grade: #262a31;
  --trilho: #252930;
  --eixo: #353a43;
  --borda: rgba(255, 255, 255, 0.07);
  --sombra: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 24px rgba(0, 0, 0, 0.25);
  --serie-1: #3987e5;
  --serie-2: #d95926;
  --serie-3: #199e70;
  --apagado: #3a3f48;
  --lavagem: rgba(57, 135, 229, 0.10);
  --lavagem-forte: rgba(57, 135, 229, 0.18);
  --sobe: #0ca30c;
  --desce: #e66767;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--plano); color: var(--tinta);
       font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
.topo { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--plano) 88%, transparent);
        backdrop-filter: blur(10px); border-bottom: 1px solid var(--borda); }
.topo-dentro { max-width: 1240px; margin: 0 auto; padding: 14px 16px 10px; }
.linha-titulo { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; justify-content: space-between; }
h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
.meta { color: var(--tinta-3); font-size: 12px; }
.filtros { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; margin-top: 12px; }
.campo { display: grid; gap: 3px; }
.campo > span { color: var(--tinta-3); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
select, button, input[type="search"] {
  font: inherit; color: var(--tinta); background: var(--superficie); border: 1px solid var(--borda);
  border-radius: 9px; padding: 6px 10px; box-shadow: 0 1px 1px rgba(16,24,40,.03); }
select { padding-right: 28px; }
button { cursor: pointer; }
button:hover, select:hover { border-color: var(--eixo); }
:focus-visible { outline: 2px solid var(--serie-1); outline-offset: 2px; }
.botao-icone { width: 34px; height: 34px; padding: 0; display: grid; place-items: center; }
.abas { display: flex; gap: 4px; margin-top: 12px; overflow-x: auto; padding-bottom: 2px; }
.abas button { border: none; box-shadow: none; background: transparent; color: var(--tinta-2); border-radius: 999px;
               padding: 6px 14px; white-space: nowrap; }
.abas button:hover { background: var(--superficie); }
.abas button[aria-selected="true"] { background: var(--superficie); color: var(--tinta); font-weight: 600;
                                     box-shadow: var(--sombra); }
main { max-width: 1240px; margin: 0 auto; padding: 20px 16px 48px; }
section[hidden] { display: none; }
.grade-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); gap: 16px; }
.cartao { background: var(--superficie); border: 1px solid var(--borda); border-radius: 16px; padding: 18px 20px;
          margin-bottom: 16px; box-shadow: var(--sombra); min-width: 0; }
.grade-2 > .cartao { margin-bottom: 0; }
.cartao-topo { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: flex-start; justify-content: space-between;
               margin-bottom: 14px; }
h2 { font-size: 15px; margin: 0; letter-spacing: -0.005em; }
.sub { color: var(--tinta-3); font-size: 12px; margin-top: 2px; }
.janela { display: inline-flex; gap: 6px; align-items: center; background: var(--superficie-2); color: var(--tinta-2);
          border-radius: 999px; padding: 2px 10px; font-size: 12px; margin-top: 6px; }
.controles { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.nota { color: var(--tinta-3); font-size: 12px; margin: 12px 0 0; }
/* Popover de instituições */
details.multi { position: relative; }
details.multi summary { list-style: none; cursor: pointer; background: var(--superficie); border: 1px solid var(--borda);
                        border-radius: 9px; padding: 6px 30px 6px 10px; min-width: 190px; position: relative; }
details.multi summary::-webkit-details-marker { display: none; }
details.multi summary::after { content: "▾"; position: absolute; right: 10px; color: var(--tinta-3); }
details.multi .painel-multi { position: absolute; z-index: 20; top: calc(100% + 6px); left: 0; width: 280px;
  background: var(--superficie); border: 1px solid var(--borda); border-radius: 12px; box-shadow: var(--sombra); padding: 10px; }
.painel-multi input[type="search"] { width: 100%; margin-bottom: 8px; }
.painel-multi .acoes { display: flex; gap: 6px; margin-bottom: 6px; }
.painel-multi .acoes button { padding: 3px 8px; font-size: 12px; }
.painel-multi .lista { max-height: 300px; overflow: auto; display: grid; gap: 2px; }
.painel-multi label { display: flex; gap: 8px; align-items: center; padding: 4px 6px; border-radius: 6px; cursor: pointer; }
.painel-multi label:hover { background: var(--lavagem); }
/* KPIs */
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi { background: var(--superficie); border: 1px solid var(--borda); border-radius: 14px; padding: 14px 16px; box-shadow: var(--sombra); }
.kpi .rotulo { color: var(--tinta-2); font-size: 12px; }
.kpi .valor { font-size: 24px; font-weight: 650; margin: 4px 0 2px; letter-spacing: -0.02em; }
.kpi .detalhe { color: var(--tinta-3); font-size: 12px; }
.delta { font-size: 12px; font-weight: 600; margin-left: 6px; }
.delta.sobe { color: var(--sobe); } .delta.desce { color: var(--desce); } .delta.igual { color: var(--tinta-3); }
.coletas { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.coleta { background: var(--superficie-2); border-radius: 12px; padding: 10px 12px; }
.coleta .rotulo { color: var(--tinta-2); font-size: 12px; }
.coleta .data { font-weight: 600; margin: 2px 0; }
.status { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--tinta-2); }
.status i { width: 15px; height: 15px; border-radius: 50%; display: inline-grid; place-items: center;
            font-style: normal; font-size: 10px; font-weight: 700; color: #fff; }
.status .bom { background: var(--bom); }
.status .atencao { background: var(--atencao); color: #0b0b0b; }
.status .critico { background: var(--critico); }
.status .nenhum { background: var(--tinta-3); }
/* Linhas de gráfico (barras, pontos, halteres) */
.eixo-topo { display: grid; grid-template-columns: var(--col-nome) 1fr var(--col-valor); gap: 12px; height: 18px;
             margin-bottom: 2px; }
.eixo-topo .escala { position: relative; }
.eixo-topo .escala span { position: absolute; transform: translateX(-50%); color: var(--tinta-3); font-size: 11px;
                          font-variant-numeric: tabular-nums; }
.linhas { display: grid; gap: 2px; --col-nome: minmax(110px, 210px); --col-valor: 86px; }
.linha { display: grid; grid-template-columns: var(--col-nome) 1fr var(--col-valor); gap: 12px; align-items: center;
         min-height: 26px; border-radius: 8px; padding: 0 6px; }
.linha:hover, .linha:focus-visible { background: var(--lavagem); }
.linha .nome { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--tinta-2); text-align: right; }
.linha .area { position: relative; height: 22px; }
.linha .trilho { position: absolute; left: 0; right: 0; top: 50%; height: 10px; transform: translateY(-50%);
                 background: var(--trilho); border-radius: 5px; }
.linha .barra { position: absolute; left: 0; top: 50%; height: 10px; transform: translateY(-50%);
                background: var(--serie-1); border-radius: 0 5px 5px 0; min-width: 3px; }
.linha .guia { position: absolute; top: 50%; height: 1px; background: var(--eixo); left: 0; right: 0; }
.linha .grade-v { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--grade); }
.linha .ponto { position: absolute; top: 50%; width: 12px; height: 12px; border-radius: 50%; transform: translate(-50%, -50%);
                background: var(--serie-1); box-shadow: 0 0 0 2px var(--superficie); }
.linha .ponto.s2 { background: var(--serie-2); }
.linha .haste { position: absolute; top: 50%; height: 2px; transform: translateY(-50%); background: var(--eixo); }
.linha .valor { color: var(--tinta); font-variant-numeric: tabular-nums; white-space: nowrap; }
.linha .valor.vazio { color: var(--tinta-3); }
.linha .chip { font-size: 11px; color: var(--tinta-2); background: var(--superficie-2); border-radius: 999px; padding: 1px 8px; margin-left: 6px; }
.linhas.com-destaque .linha:not(.destaque) .barra,
.linhas.com-destaque .linha:not(.destaque) .ponto { background: var(--apagado); }
.linha.destaque { background: var(--lavagem-forte); }
.linha.destaque .nome { color: var(--tinta); font-weight: 600; }
.legenda { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-bottom: 10px; color: var(--tinta-2); font-size: 13px; }
.legenda span { display: inline-flex; align-items: center; gap: 6px; }
.legenda i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.legenda i.traco { width: 14px; height: 3px; border-radius: 2px; }
/* Tabelas */
.rolagem { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--grade); text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--tinta-2); font-weight: 600; font-size: 12px; vertical-align: bottom; }
th button { border: none; background: none; box-shadow: none; padding: 0; color: inherit; font-weight: inherit; text-align: inherit; }
th[aria-sort] button::after { content: " ↕"; color: var(--tinta-3); }
th[aria-sort="ascending"] button::after { content: " ↑"; color: var(--tinta); }
th[aria-sort="descending"] button::after { content: " ↓"; color: var(--tinta); }
tbody tr:hover td { background: var(--lavagem); }
tr.destaque td { background: var(--lavagem-forte); font-weight: 600; }
td.vazio { color: var(--tinta-3); }
.grupo { color: var(--tinta-3); font-weight: 500; display: block; font-size: 11px; }
a { color: var(--serie-1); }
/* SVG */
svg text { fill: var(--tinta-3); font-size: 11px; font-family: inherit; }
svg .rotulo-linha { fill: var(--tinta); font-size: 12px; }
.vazio-grafico { color: var(--tinta-3); padding: 28px 0; text-align: center; }
#dica { position: fixed; pointer-events: none; z-index: 30; background: var(--superficie); color: var(--tinta);
        border: 1px solid var(--borda); border-radius: 10px; padding: 9px 11px; box-shadow: var(--sombra);
        font-size: 13px; max-width: 300px; display: none; }
#dica .t { font-weight: 600; margin-bottom: 3px; }
#dica .l { display: flex; justify-content: space-between; gap: 14px; color: var(--tinta-2); }
#dica .l b { color: var(--tinta); font-weight: 600; font-variant-numeric: tabular-nums; }
/* Tabelas de indicadores com variação */
td .v { font-weight: 600; }
td .x { display: block; font-size: 11px; font-weight: 500; color: var(--tinta-3); line-height: 1.2; }
td .x.melhor { color: var(--sobe); } td .x.pior { color: var(--desce); }
.compacta td { padding: 7px 10px; }
/* Exportar */
details.exportar { position: relative; }
details.exportar summary { list-style: none; cursor: pointer; background: var(--superficie); border: 1px solid var(--borda);
  border-radius: 9px; padding: 6px 12px; }
details.exportar summary::-webkit-details-marker { display: none; }
details.exportar .painel-multi { right: 0; left: auto; width: 330px; font-size: 13px; color: var(--tinta-2); }
details.exportar code { display: block; background: var(--superficie-2); color: var(--tinta); border-radius: 8px; padding: 8px 10px;
  margin: 6px 0 10px; font-size: 12px; user-select: all; }
details.exportar .acoes { display: flex; gap: 8px; flex-wrap: wrap; }
@media print {
  .topo { position: static; backdrop-filter: none; }
  .filtros, .abas, .controles button, .controles select, details.exportar { display: none !important; }
  .cartao, .kpi { box-shadow: none; break-inside: avoid-page; }
  body { background: #fff; }
}
@media (max-width: 640px) {
  .linhas { --col-nome: minmax(80px, 34%); --col-valor: 70px; }
  .campo { flex: 1 1 140px; }
  details.multi summary { min-width: 0; }
}
</style>
</head>
<body>
<div class="topo"><div class="topo-dentro">
  <div class="linha-titulo">
    <h1>Monitor de reputação</h1>
    <span class="meta" id="meta"></span>
  </div>
  <div class="filtros" id="filtros"></div>
  <div class="abas" role="tablist" id="abas"></div>
</div></div>
<main id="conteudo"></main>
<div id="dica" role="tooltip"></div>

<script>
"use strict";
const DADOS = /*__DADOS__*/null;

{ const tema = /tema=(light|dark)/.exec(location.hash) ;
  let salvo = null; try { salvo = localStorage.getItem("painel-tema"); } catch (e) { /* ok */ }
  const t = tema ? tema[1] : salvo; if (t) document.documentElement.dataset.theme = t; }

// ================================================================ dados
const INST = new Map([...DADOS.instituicoes].sort((a, b) => a[1].localeCompare(b[1], "pt-BR"))
  .map(([id, nome, curto, segmento]) => [id, { id, nome, curto, segmento }]));
const PERFIS = new Map(DADOS.perfis.map(([id, inst, plat, ident, rotulo]) => [id, { id, inst, plat, ident, rotulo }]));
const METRICAS = new Map(DADOS.metricas.map(([codigo, descricao, unidade]) => [codigo, { descricao, unidade }]));
// Série de cada perfil/métrica, em ordem de data: [ref, valor, texto, ini, fim]
const SERIES = new Map();
for (const [perfil, metrica, ref, valor, texto, ini, fim] of DADOS.historico) {
  const chave = perfil + "|" + metrica;
  if (!SERIES.has(chave)) SERIES.set(chave, []);
  const lista = SERIES.get(chave);
  if (lista.length && lista[lista.length - 1][0] === ref) lista.pop(); // mesmo dia: vale o último
  lista.push([ref, valor, texto, ini, fim]);
}
const DATAS = [...new Set(DADOS.historico.map((h) => h[2]))].sort().reverse();
const PLATAFORMAS = { app_store: "App Store", google_play: "Google Play", consumidor_gov: "Consumidor.gov.br",
  reclame_aqui: "Reclame Aqui", instagram: "Instagram" };
// [rótulo, formato, sentido]: sentido "menor" = menor é melhor; "volume" = sem melhor/pior.
const ROTULOS = {
  nota_media: ["Nota média", "nota", "maior"],
  total_reclamacoes: ["Reclamações", "contagem", "volume"],
  pct_resolvidas: ["Resolvidas / índice de solução", "pct", "maior"],
  pct_respondidas: ["Respondidas", "pct", "maior"],
  nota_consumidor: ["Nota do consumidor", "nota", "maior"],
  tempo_resposta_dias: ["Tempo de resposta", "dias", "menor"],
  pct_voltaria_negocio: ["Voltariam a fazer negócio", "pct", "maior"],
  aguardando_resposta: ["Aguardando resposta", "contagem", "menor"],
  reclamacoes_avaliadas: ["Reclamações avaliadas", "contagem", "volume"],
  nota_reclame_aqui: ["Nota Reclame Aqui", "nota", "maior"],
  seguidores: ["Seguidores", "contagem", "maior"],
  posts_periodo: ["Posts no mês", "contagem", "volume"],
  curtidas_media: ["Curtidas médias por post", "contagem", "maior"],
  curtidas_total: ["Curtidas no mês", "contagem", "maior"],
  posts_mes: ["Posts no mês", "contagem", "volume"],
  diferenca_lojas: ["Diferença (AS − GP)", "nota", "volume"],
};
const fmtInt = new Intl.NumberFormat("pt-BR", { maximumFractionDigits: 0 });
const fmtCompacto = new Intl.NumberFormat("pt-BR", { notation: "compact", maximumFractionDigits: 1 });
const fmtDec = (c) => new Intl.NumberFormat("pt-BR", { minimumFractionDigits: c, maximumFractionDigits: c });
const fmtData = (iso) => iso ? iso.slice(0, 10).split("-").reverse().join("/") : "—";
const nomeMes = (iso) => new Date(iso.slice(0, 7) + "-15T12:00:00").toLocaleDateString("pt-BR", { month: "long", year: "numeric" });
const vazio = (v) => v === null || v === undefined || Number.isNaN(v);
function formatar(metrica, v, compacto) {
  if (vazio(v)) return "—";
  const tipo = (ROTULOS[metrica] || [, "dec"])[1];
  if (Math.abs(v) < 0.005) v = 0; // evita "-0,00"
  if (tipo === "contagem") return compacto && v >= 10000 ? fmtCompacto.format(v) : fmtInt.format(v);
  if (tipo === "pct") return fmtDec(1).format(v) + "%";
  if (tipo === "dias") return fmtDec(1).format(v) + " d";
  return fmtDec(2).format(v);
}
const rotuloMetrica = (m) => (ROTULOS[m] || [METRICAS.get(m)?.descricao || m])[0];
const sentido = (m) => (ROTULOS[m] || [, , "maior"])[2];
const escalaNota = (plat, m) => m === "nota_reclame_aqui" || (plat === "reclame_aqui" && m === "nota_consumidor") ? 10 : 5;
function nomePerfil(p, curto) {
  const base = INST.get(p.inst)?.nome || "?";
  if (p.rotulo) return `${base} · ${p.rotulo}`;
  if (p.plat === "instagram" && !curto) return `${base} (@${p.ident})`;
  return base;
}

// ================================================================ estado e filtros
const estado = {
  data: DATAS[0] || null,
  destaque: "",
  selecionadas: new Set(INST.keys()),
  aba: 0,
};
const local = {}; // escolhas de cada cartão (métrica, corte...), preservadas entre redesenhos
try {
  const salvo = JSON.parse(localStorage.getItem("painel-estado") || "{}");
  if (salvo.destaque && INST.has(Number(salvo.destaque))) estado.destaque = salvo.destaque;
  if (Array.isArray(salvo.selecionadas) && salvo.selecionadas.length) {
    const validas = salvo.selecionadas.filter((id) => INST.has(id));
    if (validas.length) estado.selecionadas = new Set(validas);
  }
  if (Number.isInteger(salvo.aba)) estado.aba = salvo.aba;
  Object.assign(local, salvo.local || {});
} catch (e) { /* sem armazenamento */ }
const pedida = /aba=(\d+)/.exec(location.hash);
if (pedida) estado.aba = Number(pedida[1]);
const destaquePedido = /destaque=(\d+)/.exec(location.hash);
if (destaquePedido && INST.has(Number(destaquePedido[1]))) estado.destaque = destaquePedido[1];
function salvarEstado() {
  try { localStorage.setItem("painel-estado", JSON.stringify({ destaque: estado.destaque,
    selecionadas: [...estado.selecionadas], aba: estado.aba, local })); } catch (e) { /* ok */ }
}
const visivel = (instId) => estado.selecionadas.has(instId);
const perfisDe = (plat) => [...PERFIS.values()].filter((p) => p.plat === plat && visivel(p.inst));

// Valor vigente na data escolhida: o último snapshot até ela.
function vigente(perfil, metrica, data = estado.data) {
  const lista = SERIES.get(perfil + "|" + metrica);
  if (!lista || !data) return null;
  for (let i = lista.length - 1; i >= 0; i--) {
    if (lista[i][0] <= data) {
      const [ref, valor, texto, ini, fim] = lista[i];
      return { ref, valor, texto, ini, fim, anterior: i > 0 ? lista[i - 1][1] : null };
    }
  }
  return null;
}

// Data de comparação: último levantamento do mês anterior, o levantamento anterior ou nenhuma.
{ const pedido = /comparar=(mes|anterior|nenhum)/.exec(location.hash); if (pedido) local.comparar = pedido[1]; }
if (!["mes", "anterior", "nenhum"].includes(local.comparar)) local.comparar = "mes";
function dataComparacao() {

function graficoTempo(series, metrica, plataforma) {

  const mudar = (k, v) => { local[chave + k] = v; salvarEstado(); redesenhar(); };
  const selPerfil = (i) => seletor(`Perfil ${i + 1}`, [["", "—"], ...ps.map((p) => [String(p.id), nomePerfil(p, true)])], escolhidos[i] ? String(escolhidos[i]) : "",
    (v) => { const novo = [...escolhidos]; if (v) novo[i] = Number(v); else novo.splice(i, 1); mudar(":perfis:" + plat, [...new Set(novo.filter(Boolean))]); });
  return el("section", {}, [cartao("Evolução no tempo",
    el("div", { class: "janela", text: `De ${fmtData(de)} até ${fmtData(ate)} (filtro "Dados até")` }), [
      seletor("Fonte", plataformas.map((pl) => [pl, PLATAFORMAS[pl]]), plat, (v) => mudar(":p", v)),
      metrica ? seletor("Métrica", codigos.map((m) => [m, rotuloMetrica(m)]), metrica, (v) => mudar(":m", v)) : null,
      seletor("A partir de", [...DATAS].reverse().filter((d) => d <= ate).map((d) => [d, fmtData(d)]), de, (v) => mudar(":de", v)),
      botao],
    el("div", {}, [el("div", { class: "controles", style: { marginBottom: "12px" } }, [el("span", { class: "meta", text: "Comparar até 3:" }), selPerfil(0), selPerfil(1), selPerfil(2)]), corpo]),
    "Um ponto por coleta. Notas e percentuais não começam do zero: a escala acompanha os dados, com uma amplitude mínima para variações pequenas não parecerem grandes.")]);
}

// ================================================================ filtros globais
function montarFiltros() {
  const caixa = document.getElementById("filtros");
  const selData = seletor("Dados até", DATAS.map((d, i) => [d, fmtData(d) + (i === 0 ? " (mais recente)" : "")]), estado.data || "",
    (v) => { estado.data = v; redesenhar(); });
  // Instituições (multi)
  const resumo = el("summary");
  const atualizarResumo = () => { resumo.textContent = estado.selecionadas.size === INST.size ? `Todas (${INST.size})` : `${estado.selecionadas.size} de ${INST.size}`; };
  const busca = el("input", { type: "search", placeholder: "Buscar…", "aria-label": "Buscar instituição" });
  const lista = el("div", { class: "lista" });
  const caixas = [...INST.values()].map((i) => {
    const cb = el("input", { type: "checkbox", value: i.id });
    cb.checked = estado.selecionadas.has(i.id);
    cb.addEventListener("change", () => { if (cb.checked) estado.selecionadas.add(i.id); else estado.selecionadas.delete(i.id); atualizarResumo(); salvarEstado(); redesenhar(); });
    const rotulo = el("label", {}, [cb, i.nome]); lista.append(rotulo);
    return [i, cb, rotulo];
  });
  busca.addEventListener("input", () => { const q = busca.value.toLowerCase(); caixas.forEach(([i, , r]) => { r.hidden = !i.nome.toLowerCase().includes(q); }); });
  const todas = (marcar) => { caixas.forEach(([i, cb]) => { cb.checked = marcar; if (marcar) estado.selecionadas.add(i.id); else estado.selecionadas.delete(i.id); }); atualizarResumo(); salvarEstado(); redesenhar(); };
  const multi = el("details", { class: "multi" }, [resumo, el("div", { class: "painel-multi" }, [busca,
    el("div", { class: "acoes" }, [el("button", { type: "button", text: "Todas", onclick: () => todas(true) }), el("button", { type: "button", text: "Nenhuma", onclick: () => todas(false) })]), lista])]);
  document.addEventListener("click", (e) => { if (!multi.contains(e.target)) multi.open = false; });
  atualizarResumo();
  const selDestaque = seletor("Destacar", [["", "Nenhuma"], ...[...INST.values()].map((i) => [String(i.id), i.nome])], estado.destaque,
    (v) => { estado.destaque = v; salvarEstado(); redesenhar(); });
  const tema = el("button", { type: "button", class: "botao-icone", title: "Alternar tema claro/escuro", "aria-label": "Alternar tema", text: "◐",
    onclick: () => {
      const atual = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      const novo = atual === "dark" ? "light" : "dark";
      document.documentElement.dataset.theme = novo;
      try { localStorage.setItem("painel-tema", novo); } catch (e) { /* ok */ }
      redesenhar();
    } });
  const selComparar = seletor("Comparar com", [["mes", "Mês anterior"], ["anterior", "Levantamento anterior"], ["nenhum", "Sem comparação"]],
    local.comparar, (v) => { local.comparar = v; salvarEstado(); redesenhar(); });
  const mesAtual = (estado.data || "").slice(0, 7);
  const exportar = el("details", { class: "exportar" }, [el("summary", { text: "Exportar" }), el("div", { class: "painel-multi" }, [
    el("div", { text: "Relatório formatado (PDF e Excel, com tabelas, gráficos e variação do mês) — rode no PowerShell, na pasta do projeto:" }),
    el("code", { text: `uv run monitor relatorio --mes ${mesAtual || "AAAA-MM"} --abrir` }),
    el("div", { text: "Ou exporte o que está na tela:" }),
    el("div", { class: "acoes", style: { marginTop: "6px" } }, [
      el("button", { type: "button", text: "Imprimir / salvar PDF desta aba", onclick: () => window.print() })]),
    el("div", { class: "meta", style: { marginTop: "8px" }, text: "Cada tabela também tem o botão \"Baixar CSV\", que abre no Excel." }),
  ])]);
  document.addEventListener("click", (e) => { if (!exportar.contains(e.target)) exportar.open = false; });
  caixa.replaceChildren(
    el("label", { class: "campo" }, [el("span", { text: "Dados até" }), selData]),
    el("label", { class: "campo" }, [el("span", { text: "Comparar com" }), selComparar]),
    el("div", { class: "campo" }, [el("span", { text: "Instituições" }), multi]),
    el("label", { class: "campo" }, [el("span", { text: "Destacar" }), selDestaque]),
    el("div", { class: "campo" }, [el("span", { text: "Tema" }), tema]),
    el("div", { class: "campo", style: { marginLeft: "auto" } }, [el("span", { text: " " }), exportar]),
  );
}

// ================================================================ montagem
document.getElementById("meta").textContent = `Dados de ${DADOS.origem} · página gerada em ${DADOS.gerado_em}`;
const SECOES = [["Visão geral", secaoVisaoGeral], ["Lojas de apps", secaoLojas], ["Consumidor.gov.br", secaoConsumidor],
  ["Reclame Aqui", secaoReclameAqui], ["Instagram", secaoInstagram], ["Mensal", secaoMensal], ["Evolução", secaoEvolucao]];
const abas = document.getElementById("abas");
const conteudo = document.getElementById("conteudo");
SECOES.forEach(([nome], i) => abas.append(el("button", { type: "button", role: "tab", "aria-selected": "false", text: nome,
  onclick: () => { estado.aba = i; salvarEstado(); redesenhar(); } })));
function redesenhar() {
  esconderDica();
  estado.aba = Math.min(Math.max(0, estado.aba), SECOES.length - 1);
  [...abas.children].forEach((b, k) => b.setAttribute("aria-selected", String(k === estado.aba)));
  const rolagem = window.scrollY;
  const sec = SECOES[estado.aba][1]();
  sec.setAttribute("role", "tabpanel");
  conteudo.replaceChildren(sec);
  window.scrollTo(0, rolagem);
}
montarFiltros();
if (!DATAS.length) conteudo.append(el("p", { class: "vazio-grafico", text: "O banco ainda não tem coletas." }));
redesenhar();
</script>
</body>
</html>
