[project]
name = "monitor-reputacao"
version = "0.1.0"
description = "Monitoramento de reputação digital de instituições financeiras brasileiras"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    # Versão fixa: a biblioteca lê o HTML da loja e pode mudar de comportamento entre versões.
    "google-play-scraper==1.2.7",
    "httpx>=0.27",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0.30",
    "typer>=0.12",
    "tzdata>=2024.1",
]

[project.scripts]
monitor = "monitor.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: consulta as lojas reais pela rede (rode com: uv run pytest -m live)"]
addopts = "-m 'not live'"
